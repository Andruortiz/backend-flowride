services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowride
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowride-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowride"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flowride-datos:
