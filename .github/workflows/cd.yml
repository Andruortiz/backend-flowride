name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGEN_NOMBRE: flowride-api

jobs:

  validar:
    name: Validar tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.datos.outputs.version }}
      imagen_tag: ${{ steps.datos.outputs.imagen_tag }}
      entorno: ${{ steps.datos.outputs.entorno }}
      prerelease: ${{ steps.datos.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar formato y origen del tag
        id: datos
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::El tag '$TAG' no es SemVer (esperado vX.Y.Z o vX.Y.Z-rc.N)"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El commit del tag no pertenece a main. Solo se despliega lo que ya está integrado."
            exit 1
          fi

          VERSION="${TAG#v}"
          SHA7="${GITHUB_SHA::7}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "imagen_tag=${VERSION}-${SHA7}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "entorno=piloto" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "entorno=produccion" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: validar
    uses: ./.github/workflows/ci.yml
    with:
      omitir-sonar: true

  imagen:
    name: Construir y publicar imagen
    needs: [validar, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      referencia: ${{ steps.nombre.outputs.referencia }}
    steps:
      - uses: actions/checkout@v7

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "referencia=ghcr.io/${OWNER}/${IMAGEN_NOMBRE}:${{ needs.validar.outputs.imagen_tag }}" >> "$GITHUB_OUTPUT"

      - name: Construir
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ needs.validar.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${{ steps.nombre.outputs.referencia }}" .

      - name: Escanear vulnerabilidades
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.nombre.outputs.referencia }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        run: docker push "${{ steps.nombre.outputs.referencia }}"


  migraciones:
    name: Migration bundle
    needs: [validar, ci]
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Generar bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project src/FlowRide.Infraestructura \
            --startup-project src/FlowRide.Inicializador \
            --self-contained -r linux-x64 \
            --output flowride-migrations-${{ needs.validar.outputs.imagen_tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: migrations-${{ needs.validar.outputs.imagen_tag }}
          path: flowride-migrations-*


  desplegar:
    name: Desplegar a ${{ needs.validar.outputs.entorno }}
    needs: [validar, imagen]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validar.outputs.entorno }}
    steps:
      - name: Despliegue (pendiente de definir el destino)
        run: |
          echo "Entorno : ${{ needs.validar.outputs.entorno }}"
          echo "Imagen  : ${{ needs.imagen.outputs.referencia }}"
          echo "TODO: reemplazar este paso por el despliegue real al destino elegido"
          echo "      (por cada operador: migraciones -> imagen -> /health/ready -> pruebas de humo)."

  release:
    name: Publicar release
    needs: [validar, desplegar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ARGS=(--generate-notes --title "$GITHUB_REF_NAME" --verify-tag)
          if [[ "${{ needs.validar.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${ARGS[@]}"
