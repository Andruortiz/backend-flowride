name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ACR_NOMBRE: flowrideadom1
  AZURE_GRUPO: rg-flowride-demo

jobs:

  validar:
    name: Validar tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.datos.outputs.version }}
      imagen_tag: ${{ steps.datos.outputs.imagen_tag }}
      entorno: ${{ steps.datos.outputs.entorno }}
      prerelease: ${{ steps.datos.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar formato y origen del tag
        id: datos
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::El tag '$TAG' no es SemVer (esperado vX.Y.Z o vX.Y.Z-rc.N)"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El commit del tag no pertenece a main. Solo se despliega lo que ya está integrado."
            exit 1
          fi

          VERSION="${TAG#v}"
          SHA7="${GITHUB_SHA::7}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "imagen_tag=${VERSION}-${SHA7}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "entorno=piloto" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "entorno=produccion" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: validar
    uses: ./.github/workflows/ci.yml
    with:
      omitir-sonar: true

  imagen:
    name: Imagen ${{ matrix.nombre }}
    needs: [validar, ci]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validar.outputs.entorno }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - nombre: flowride-api
            dockerfile: Dockerfile
          - nombre: flowride-borde
            dockerfile: Dockerfile.borde
    env:
      REFERENCIA: ${{ env.ACR_NOMBRE }}.azurecr.io/${{ matrix.nombre }}:${{ needs.validar.outputs.imagen_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Construir
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ needs.validar.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -f "${{ matrix.dockerfile }}" -t "$REFERENCIA" .

      - name: Escanear vulnerabilidades
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REFERENCIA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Iniciar sesión en el registro
        run: az acr login --name "$ACR_NOMBRE"

      - name: Publicar
        run: docker push "$REFERENCIA"

  migraciones:
    name: Migration bundle
    needs: [validar, ci]
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Generar bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project src/FlowRide.Inicializador \
            --startup-project src/FlowRide.Inicializador \
            --self-contained -r linux-x64 \
            --output flowride-migrations-${{ needs.validar.outputs.imagen_tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: migrations-${{ needs.validar.outputs.imagen_tag }}
          path: flowride-migrations-*

  desplegar:
    name: Desplegar a ${{ needs.validar.outputs.entorno }}
    needs: [validar, imagen]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validar.outputs.entorno }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Habilitar la extensión de Container Apps
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Actualizar el backend
        run: |
          az containerapp update \
            --resource-group "$AZURE_GRUPO" \
            --name ca-flowride-api \
            --image "$ACR_NOMBRE.azurecr.io/flowride-api:${{ needs.validar.outputs.imagen_tag }}"

      - name: Actualizar el borde
        run: |
          az containerapp update \
            --resource-group "$AZURE_GRUPO" \
            --name ca-flowride-borde \
            --image "$ACR_NOMBRE.azurecr.io/flowride-borde:${{ needs.validar.outputs.imagen_tag }}"

      - name: Prueba de humo
        run: |
          FQDN=$(az containerapp show --resource-group "$AZURE_GRUPO" --name ca-flowride-borde --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "https://${FQDN}/health/ready"

  release:
    name: Publicar release
    needs: [validar, desplegar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ARGS=(--generate-notes --title "$GITHUB_REF_NAME" --verify-tag)
          if [[ "${{ needs.validar.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${ARGS[@]}"
